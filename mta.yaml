_schema-version: 3.3.0
ID: ESMA
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: ESMA-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: ESMA-auth
      - name: ESMA-db
      - name: ESMA-destination

  - name: ESMA-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: ESMA-db
  - name: ESMA
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: ESMA-auth
      - name: ESMA-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: ESMA-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: ESMAcertificationsui
          artifacts:
            - '*.zip'
          target-path: app/
        - name: ESMAesmaui
          artifacts:
            - '*.zip'
          target-path: app/
        - name: ESMAprojectsui
          artifacts:
            - '*.zip'
          target-path: app/
        - name: ESMAskillsui
          artifacts:
            - '*.zip'
          target-path: app/
    requires:
      - name: ESMA-auth
      - name: srv-api
      - name: ESMA-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  - name: ESMAcertificationsui
    type: html5
    path: app/certifications-ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: ESMAesmaui
    type: html5
    path: app/esma-ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: ESMAprojectsui
    type: html5
    path: app/projects-ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: ESMAskillsui
    type: html5
    path: app/skills-ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: ESMA-destinations
    type: com.sap.application.content
    requires:
      - name: ESMA-auth
        parameters:
          service-key:
            name: ESMA-auth-key
      - name: ESMA-html5-repo-host
        parameters:
          service-key:
            name: ESMA-html5-repo-host-key
      - name: srv-api
      - name: ESMA-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: ESMA-html5-repository
              ServiceInstanceName: ESMA-html5-repo-host
              ServiceKeyName: ESMA-html5-repo-host-key
              sap.cloud.service: ESMA.service
            - Name: ESMA-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: ESMA-auth
              ServiceKeyName: ESMA-auth-key
              sap.cloud.service: ESMA.service

resources:
  - name: ESMA-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: ESMA-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api
  - name: ESMA-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: ESMA-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: ESMA-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: ESMA-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
